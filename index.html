}
// configuração global (desligada por padrão) que decide se a nota média de
// Comportamento entra na conta da Nota Bimestral, junto com avaliações e,
// se ativada, Atividade em sala
const CONSIDERAR_COMPORTAMENTO_KEY = "diario-turmas-considerar-comportamento-na-nota";
function considerarComportamentoNaNota() { return localStorage.getItem(CONSIDERAR_COMPORTAMENTO_KEY) === "true"; }
function definirConsiderarComportamentoNaNota(valor) {
  localStorage.setItem(CONSIDERAR_COMPORTAMENTO_KEY, valor ? "true" : "false");
  render();
}
// configuração global (desligada por padrão) que decide se a nota de vistos
// de caderno/apostila/tarefas entra na conta da Nota Bimestral
const CONSIDERAR_VISTOS_CADERNO_KEY = "diario-turmas-considerar-vistos-caderno-na-nota";
function considerarVistosCadernoNaNota() { return localStorage.getItem(CONSIDERAR_VISTOS_CADERNO_KEY) === "true"; }
function definirConsiderarVistosCadernoNaNota(valor) {

  render();
}
const CONSIDERAR_VISTOS_APOSTILA_KEY = "diario-turmas-considerar-vistos-apostila-na-nota";

// nota final do bimestre pra esse aluno: média das avaliações/provas externas,
// combinada com a média de Atividade em sala quando essa opção estiver ligada
// nas configurações (se um dos dois não tiver dado nenhum, usa só o outro)
// nota média de Comportamento só desse aluno nesse bimestre — mesma regra de
// "sem nada marcado = Excelente" usada no Resumo, mas calculada sozinha (sem
// precisar rodar o cálculo do resumo inteiro de novo)
function notaComportamentoAluno(bimestre, alunoId) {
  const faces = { excelente: 0, bom: 0, regular: 0, insatisfatorio: 0 };
  bimestre.dias.forEach(d => {
    const r = d.registros[alunoId];
    if (!r) return;
    faces[r.comportamento || "excelente"]++;
  });
  return notaMediaComportamento(faces);
}
// nota final do bimestre: combina (em média simples) os componentes que
// estiverem ativados nas Configurações e que tiverem algum dado — avaliações
// e provas externas sempre entram quando existirem; Atividade em sala e
// Comportamento só entram se a pessoa ligar essas opções em Configurações
function calcularNotaBimestral(bimestre, alunoId) {
  const componentes = [];
  const notaAvaliacoes = mediaAvaliacoes([...bimestre.avaliacoes, ...bimestre.provasPaulistas], alunoId);
  if (notaAvaliacoes !== null) componentes.push(notaAvaliacoes);

  if (considerarComportamentoNaNota()) {
    const notaComp = notaComportamentoAluno(bimestre, alunoId);
    if (notaComp !== null) componentes.push(notaComp);
  }

  if (considerarVistosCadernoNaNota()) {
    componentes.push(notaVistosCaderno((bimestre.vistosCaderno && bimestre.vistosCaderno[alunoId]) || 0));
  }
  if (considerarVistosApostilaNaNota()) {
    componentes.push(notaVistosApostila((bimestre.vistosApostila && bimestre.vistosApostila[alunoId]) || 0));
  }
  if (considerarVistosTarefasNaNota()) {
    componentes.push(notaVistosTarefas((bimestre.vistosTarefas && bimestre.vistosTarefas[alunoId]) || 0));
  }

  if (componentes.length === 0) return null;
  return componentes.reduce((soma, n) => soma + n, 0) / componentes.length;
}
// só usada quando o bimestre não tem nenhuma avaliação/prova lançada — deixa
// registrar manualmente a média que a pessoa já tinha de outro jeito (papel,
// sistema antigo etc.), pra turma inteira do ano não ficar com buraco
function atualizarNotaManual(turmaId, bimestreId, alunoId, valor) {
  const b = getBimestre(turmaId, bimestreId);
  if (!b.notasManuais) b.notasManuais = {};
  if (valor === "" || valor === null || valor === undefined) delete b.notasManuais[alunoId];
  else b.notasManuais[alunoId] = valor;
  commitDebounced();
}
// vistos de caderno: contador por aluno, válido pro bimestre inteiro — não
// depende de qual dia está selecionado (diferente de quantidade de aulas, que
// é por dia). Atualiza na hora, já que é um clique único, não digitação.
function atualizarVistosCaderno(turmaId, bimestreId, alunoId, valor) {
  const b = getBimestre(turmaId, bimestreId);
  if (!b.vistosCaderno) b.vistosCaderno = {};
  b.vistosCaderno[alunoId] = Math.max(0, valor);
  salvar(); render();
}
// mesma ideia do caderno, mas pra atividades da apostila feitas — também por
// aluno, valendo pro bimestre inteiro, não muda de um dia pro outro
function atualizarVistosApostila(turmaId, bimestreId, alunoId, valor) {
  const b = getBimestre(turmaId, bimestreId);
  if (!b.vistosApostila) b.vistosApostila = {};

}
// mesma ideia, pra tarefas feitas
function atualizarVistosTarefas(turmaId, bimestreId, alunoId, valor) {
  const b = getBimestre(turmaId, bimestreId);
  if (!b.vistosTarefas) b.vistosTarefas = {};
  b.vistosTarefas[alunoId] = Math.max(0, valor);

}
// nota de um bimestre ANTERIOR a quando a pessoa começou a usar o app (ex.:
// começou a registrar só a partir do 3º bimestre, mas quer ver o 1º e o 2º
// no Resumo do Ano também) — numero vai de 1 até turma.qtdBimestresAnteriores
function atualizarNotaBimestreAnterior(turmaId, numero, alunoId, valor) {
  const t = turmas.find(t => t.id === turmaId);
  if (!t.notasBimestresAnteriores[numero]) t.notasBimestresAnteriores[numero] = {};
  if (valor === "" || valor === null || valor === undefined) delete t.notasBimestresAnteriores[numero][alunoId];
  else t.notasBimestresAnteriores[numero][alunoId] = valor;
  commitDebounced();
}

// ---------- Resumo consolidado de todos os bimestres (sempre por último) ----------
function renderResumoBimestres(turma) {
  if (turma.bimestres.length === 0 || turma.alunos.length === 0) return "";
  const alunos = ordenarPorNome(turma.alunos);
  return `
    <div class="resumo-section resumo-bimestres">
      <div class="resumo-title">${t("resumo_ano_titulo")}</div>
      <div class="resumo-sub">Nota de cada bimestre e presenças totais do ano, por aluno · arraste para o lado para ver todas as colunas</div>
      <div class="resumo-scroll">
        <table class="resumo">
          <thead>
            <tr>
              <th class="name-col">Estudante</th>
              ${Array.from({length: turma.qtdBimestresAnteriores}, (_, idx) => idx + 1).map(n => `<th title="${t('bimestre_anterior_titulo')}">${n}º bim. (anterior)</th>`).join("")}
              ${turma.bimestres.map(b => `<th class="${b.id === turma.bimestreAtivoId ? 'coluna-bimestre-atual' : ''}">${esc(b.nome) || "Bimestre"}</th>`).join("")}
              <th>Presenças Totais</th>
              <th title="Soma das aulas dadas em todos os bimestres, contando só os dias com chamada preenchida pra esse aluno">Aulas Dadas Totais</th>
              <th title="Quantidade de dias com pelo menos uma ocorrência marcada, de qualquer tipo">Ocorrências Totais</th>
              ${turma.mapeamento ? `<th>Mapeamento Total</th>` : ""}
            </tr>
          </thead>
          <tbody>
            ${alunos.map((a, ai) => {
              let presencasTotais = 0, diasTotais = 0, mapSimTotal = 0, mapDiasTotal = 0, ocorrenciasTotais = 0, aulasDadasTotais = 0;
              const celulasBimestre = turma.bimestres.map(b => {
                const r = calcularResumo([a], b)[0];
                presencasTotais += r.presente;
                diasTotais += r.totalDias;
                mapSimTotal += r.mapSim;
                mapDiasTotal += r.totalDias;
                aulasDadasTotais += r.aulasDadasAluno;
                ocorrenciasTotais += r.ocorrencias;
                const mediaAval = calcularNotaBimestral(b, a.id);
                const atual = b.id === turma.bimestreAtivoId ? "coluna-bimestre-atual" : "";
                let conteudoCelula;
                if (mediaAval !== null) {
                  const cor = corNota(mediaAval);
                  conteudoCelula = `<span style="font-weight:700;color:${cor}">${mediaAval.toFixed(1)}</span>`;
                } else {
                  const notaManual = (b.notasManuais && b.notasManuais[a.id]) || "";
                  conteudoCelula = `<input type="text" inputmode="decimal" class="nota-manual-input" placeholder="—" value="${esc(notaManual)}" title="${t('nota_manual_titulo')}" data-field="notamanual-${b.id}-${a.id}" oninput="this.value = apenasNota(this.value); atualizarNotaManual('${turma.id}', '${b.id}', '${a.id}', this.value)"><span class="nota-manual-print-only">${notaManual ? esc(notaManual) : "—"}</span>`;
                }
                return `<td class="${atual}">${conteudoCelula}</td>`;
              }).join("");
              return `
              <tr class="${ai % 2 ? 'odd' : ''}">
                <td class="name-cell">${nomeOuPlaceholder(a.nome)}</td>
                ${Array.from({length: turma.qtdBimestresAnteriores}, (_, idx) => idx + 1).map(n => {
                  const notaAnterior = (turma.notasBimestresAnteriores[n] && turma.notasBimestresAnteriores[n][a.id]) || "";
                  return `<td><input type="text" inputmode="decimal" class="nota-manual-input" placeholder="—" value="${esc(notaAnterior)}" title="${t('bimestre_anterior_titulo')}" data-field="notaanterior-${turma.id}-${n}-${a.id}" oninput="this.value = apenasNota(this.value); atualizarNotaBimestreAnterior('${turma.id}', ${n}, '${a.id}', this.value)"><span class="nota-manual-print-only">${notaAnterior ? esc(notaAnterior) : "—"}</span></td>`;
                }).join("")}
                ${celulasBimestre}
                <td>${presencasTotais}/${diasTotais}</td>
                <td>${aulasDadasTotais}</td>
                <td style="${ocorrenciasTotais > 0 ? 'color:#B5765C;font-weight:600' : ''}">${ocorrenciasTotais}/${diasTotais}</td>
                ${turma.mapeamento ? `<td>${a.noMapeamento ? `${mapSimTotal}/${mapDiasTotal}` : "—"}</td>` : ""}
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>
    <div class="resumo-section sala-futuro-checklist">
      <div class="resumo-title">✅ ${t("sala_futuro_titulo")}</div>
      <div class="resumo-sub">${t("sala_futuro_sub")}</div>
      <div class="sala-futuro-lista">
        ${turma.bimestres.map(b => `
          <label class="material-item sala-futuro-item" onclick="event.preventDefault(); atualizarRegistradoSalaFuturo('${turma.id}', '${b.id}', ${!b.registradoSalaFuturo})">
            <span class="checkbox ${b.registradoSalaFuturo ? 'checked' : ''}">${b.registradoSalaFuturo ? '✓' : ''}</span>
            ${esc(b.nome) || "Bimestre"}
          </label>
        `).join("")}
      </div>
    </div>
    <div class="exportar-row">
      <button class="btn-exportar-doc" onclick="exportarResumoAnoWord('${turma.id}')">${t("exportar_ano")}</button>
    </div>`;
}

// ---------- Gráfico aluno por aluno: compara a nota de cada estudante dentro do
// MESMO bimestre (uma fotografia, não uma evolução ao longo do tempo) ----------
function renderGraficoAlunoPorAluno(turma, bimestre) {
  if (turma.alunos.length === 0) return "";
  const alunos = ordenarPorNome(turma.alunos);
  const pontos = alunos
    .map(a => ({ nome: nomeOuPlaceholder(a.nome), y: calcularNotaBimestral(bimestre, a.id) }))
    .filter(p => p.y !== null);

  if (pontos.length === 0) {
    return `<div class="grafico-section"><div class="resumo-title">${t("grafico_aluno_titulo")}</div><div class="row-empty" style="margin-top:12px">${t("grafico_aluno_vazio")}</div></div>`;
  }

  const W = Math.max(500, pontos.length * 74), H = 240, padL = 34, padR = 20, padT = 16, padB = 46;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const larguraBarra = Math.min(46, plotW / pontos.length - 14);

  const xPix = (i) => padL + ((i + 0.5) / pontos.length) * plotW;
  const yPix = (v) => padT + plotH - (v / 10) * plotH;

  const gridLines = [0, 2, 4, 6, 8, 10].map(v => `
    <line x1="${padL}" x2="${W - padR}" y1="${yPix(v).toFixed(1)}" y2="${yPix(v).toFixed(1)}" stroke="#EEE6FB" stroke-width="1"/>
    <text x="${padL - 8}" y="${(yPix(v) + 3.5).toFixed(1)}" font-size="10.5" fill="var(--cor-texto, #8A7FA8)" text-anchor="end">${v}</text>
  `).join("");
  const linhaMinima = `<line x1="${padL}" x2="${W - padR}" y1="${yPix(6).toFixed(1)}" y2="${yPix(6).toFixed(1)}" stroke="#C99B5C" stroke-width="1.4" stroke-dasharray="5,4"/>`;

  const barras = pontos.map((p, i) => {
    const cx = xPix(i);
    const yTopo = yPix(p.y);
    const cor = corNota(p.y);
    const nomeCurto = p.nome.length > 10 ? p.nome.slice(0, 9) + "…" : p.nome;
    return `
      <rect x="${(cx - larguraBarra / 2).toFixed(1)}" y="${yTopo.toFixed(1)}" width="${larguraBarra.toFixed(1)}" height="${(padT + plotH - yTopo).toFixed(1)}" rx="4" fill="${cor}"><title>${esc(p.nome)}: ${p.y.toFixed(1)}</title></rect>
      <text x="${cx.toFixed(1)}" y="${(yTopo - 6).toFixed(1)}" font-size="11" font-weight="700" fill="${cor}" text-anchor="middle">${p.y.toFixed(1)}</text>
      <text x="${cx.toFixed(1)}" y="${H - 10}" font-size="9.5" fill="var(--cor-texto, #8A7FA8)" text-anchor="middle">${esc(nomeCurto)}</text>
    `;
  }).join("");

  return `
    <div class="grafico-section">
      <div class="resumo-title">${t("grafico_aluno_titulo")}</div>
      <div class="resumo-sub">${t("grafico_aluno_sub")}</div>
      <div class="grafico-wrap" style="overflow-x:auto"><svg class="grafico-svg" viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:none;height:auto">${gridLines}${linhaMinima}${barras}</svg></div>
      <div class="grafico-legenda"><div class="grafico-legenda-item"><span class="grafico-legenda-linha-minima"></span>${t("legenda_nota_minima")}</div></div>
    </div>`;
}

// ---------- Gráfico de progresso da turma: média geral da sala em cada bimestre,
// pra ver rapidinho se a turma como um todo está melhorando, piorando ou estavel ----------
// junta os "bimestres anteriores" (nota digitada manualmente, de antes de
// começar a usar o app) com os bimestres reais cadastrados, na ordem certa —
// usada pelos gráficos de progresso e desempenho, pra mostrar o ano inteiro
function linhaDoTempoBimestres(turma) {
  const anteriores = Array.from({ length: turma.qtdBimestresAnteriores || 0 }, (_, idx) => idx + 1).map(n => ({
    nome: `${n}º bim. (anterior)`,
    getNota: (alunoId) => {
      const mapa = turma.notasBimestresAnteriores[n];
      return mapa ? parseNota(mapa[alunoId]) : null;
    },
  }));
  const reais = turma.bimestres.map(b => ({
    nome: b.nome || "Bimestre",
    getNota: (alunoId) => calcularNotaBimestral(b, alunoId),
  }));
  return [...anteriores, ...reais];
}
function renderGraficoProgressoTurma(turma) {
  if (turma.bimestres.length === 0 || turma.alunos.length === 0) return "";

  const timeline = linhaDoTempoBimestres(turma);
  const pontos = [];
  timeline.forEach((item, bi) => {
    const medias = turma.alunos
      .map(a => item.getNota(a.id))
      .filter(m => m !== null);
    if (medias.length > 0) {
      const media = medias.reduce((soma, m) => soma + m, 0) / medias.length;
      pontos.push({ x: bi, y: media, nome: item.nome });
    }
  });

  if (pontos.length === 0) {
    return `<div class="grafico-section"><div class="resumo-title">${t("progresso_turma_titulo")}</div><div class="row-empty" style="margin-top:12px">${t("progresso_turma_vazio")}</div></div>`;
  }

  const W = 700, H = 220, padL = 34, padR = 20, padT = 16, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const larguraBarra = Math.min(70, plotW / pontos.length - 16);

  const xPix = (i) => padL + (pontos.length === 1 ? plotW / 2 : (i / (pontos.length - 1)) * plotW);
  const yPix = (v) => padT + plotH - (v / 10) * plotH;

  const gridLines = [0, 2, 4, 6, 8, 10].map(v => `
    <line x1="${padL}" x2="${W - padR}" y1="${yPix(v).toFixed(1)}" y2="${yPix(v).toFixed(1)}" stroke="#EEE6FB" stroke-width="1"/>
    <text x="${padL - 8}" y="${(yPix(v) + 3.5).toFixed(1)}" font-size="10.5" fill="var(--cor-texto, #8A7FA8)" text-anchor="end">${v}</text>
  `).join("");
  const linhaMinima = `<line x1="${padL}" x2="${W - padR}" y1="${yPix(6).toFixed(1)}" y2="${yPix(6).toFixed(1)}" stroke="#C99B5C" stroke-width="1.4" stroke-dasharray="5,4"/>`;

  const barras = pontos.map((p, i) => {
    const cx = xPix(i);
    const yTopo = yPix(p.y);
    const cor = corNota(p.y);
    return `
      <rect x="${(cx - larguraBarra / 2).toFixed(1)}" y="${yTopo.toFixed(1)}" width="${larguraBarra.toFixed(1)}" height="${(padT + plotH - yTopo).toFixed(1)}" rx="4" fill="${cor}"><title>${esc(p.nome)}: ${p.y.toFixed(1)}</title></rect>
      <text x="${cx.toFixed(1)}" y="${(yTopo - 8).toFixed(1)}" font-size="12" font-weight="700" fill="${cor}" text-anchor="middle">${p.y.toFixed(1)}</text>
      <text x="${cx.toFixed(1)}" y="${H - 10}" font-size="10.5" fill="var(--cor-texto, #8A7FA8)" text-anchor="middle">${esc(p.nome)}</text>
    `;
  }).join("");

  let tendencia = "";
  if (pontos.length >= 2) {
    const delta = pontos[pontos.length - 1].y - pontos[0].y;
    if (delta > 0.3) tendencia = `<div class="grafico-legenda-item"><span class="grafico-legenda-trend" style="color:#7C9A72"><span class="seta-cima"></span> ${t("progresso_melhorou")} ${delta.toFixed(1)} ${t("progresso_pontos")}</span></div>`;
    else if (delta < -0.3) tendencia = `<div class="grafico-legenda-item"><span class="grafico-legenda-trend" style="color:#B5765C"><span class="seta-baixo"></span> ${t("progresso_piorou")} ${Math.abs(delta).toFixed(1)} ${t("progresso_pontos")}</span></div>`;
    else tendencia = `<div class="grafico-legenda-item"><span class="grafico-legenda-trend" style="color:var(--cor-texto,#8A7FA8)">${t("progresso_estavel")}</span></div>`;
  }

  return `
    <div class="grafico-section">
      <div class="resumo-title">${t("progresso_turma_titulo")}</div>
      <div class="resumo-sub">${t("progresso_turma_sub")}</div>
      <div class="grafico-wrap"><svg class="grafico-svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${gridLines}${linhaMinima}${barras}</svg></div>
      <div class="grafico-legenda">${tendencia}<div class="grafico-legenda-item"><span class="grafico-legenda-linha-minima"></span>${t("legenda_nota_minima")}</div></div>
    </div>`;
}

// ---------- Gráfico de desempenho: compara a evolução das notas dos alunos entre os bimestres ----------
function renderGraficoDesempenho(turma) {
  if (turma.bimestres.length === 0) {
    return `<div class="row-empty" style="margin:20px">${t("nenhum_bimestre_cadastrado")}</div>`;
  }
  if (turma.alunos.length === 0) {
    return `<div class="row-empty" style="margin:20px">${t("nenhum_aluno_sala")}</div>`;
  }

  const bimestres = linhaDoTempoBimestres(turma); // ordem cronológica: anteriores + reais
  const alunos = ordenarPorNome(turma.alunos);

  // média combinada de Avaliações + Provas Externas daquele bimestre, para um aluno
  function mediaDoBimestre(bimestre, alunoId) {
    return bimestre.getNota(alunoId);
  }

  // monta uma série por aluno, só com os bimestres em que ele tem alguma nota lançada
  let series = [];
  alunos.forEach((a, i) => {
    const pontos = [];
    bimestres.forEach((b, bi) => {
      const m = mediaDoBimestre(b, a.id);
      if (m !== null) pontos.push({ x: bi, y: m });
    });
    if (pontos.length > 0) series.push({ aluno: a, cor: TAB_COLORS[i % TAB_COLORS.length], pontos });
  });

  // filtro "ver por aluno" — se um aluno específico estiver selecionado, só a série dele aparece
  const filtroValido = filtroGraficoAlunoId !== "todos" && alunos.some(a => a.id === filtroGraficoAlunoId);
  if (filtroValido) series = series.filter(s => s.aluno.id === filtroGraficoAlunoId);

  const seletorAluno = `
    <div class="grafico-filtro-aluno">
      <label class="field-label">${t("ver_desempenho_de")}</label>
      <select onchange="atualizarFiltroGrafico(this.value)">
        <option value="todos" ${!filtroValido ? "selected" : ""}>${t("todos_alunos")}</option>
        ${alunos.map(a => `<option value="${a.id}" ${filtroGraficoAlunoId === a.id ? "selected" : ""}>${nomeOuPlaceholder(a.nome)}</option>`).join("")}
      </select>
    </div>`;

  if (series.length === 0) {
    const mensagem = filtroValido
      ? t("grafico_sem_nota_aluno")
      : t("grafico_sem_nota_geral");
    return `<div class="grafico-section">${seletorAluno}<div class="row-empty" style="margin-top:12px">${mensagem}</div></div>`;
  }

  const todosValores = series.flatMap(s => s.pontos.map(p => p.y));
  const maxValorBruto = Math.max(10, ...todosValores);
  const W = 800, H = 340, padL = 34, padR = 20, padT = 16, padB = 46;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  // passo "redondo" entre as linhas de grade do eixo Y (0-10 usa de 2 em 2; escalas
  // maiores, tipo 0-100, calculam um passo maior pra não amontoar dezenas de rótulos)
  function calcularPassoGrade(max) {
    if (max <= 10) return 2;
    const bruto = max / 5;
    const potencia = Math.pow(10, Math.floor(Math.log10(bruto)));
    const residual = bruto / potencia;
    if (residual >= 5) return 10 * potencia;
    if (residual >= 2) return 5 * potencia;
    return 2 * potencia;
  }
  const passoGrade = calcularPassoGrade(maxValorBruto);
  const maxValor = Math.ceil(maxValorBruto / passoGrade) * passoGrade; // arredonda o teto pra fechar certinho na última linha
  const yPix = (valor) => padT + plotH - (valor / maxValor) * plotH;
  const xPix = (bi) => padL + (bimestres.length > 1 ? (bi * plotW) / (bimestres.length - 1) : plotW / 2);

  const gridValores = [];
  for (let v = 0; v <= maxValor + 0.01; v += passoGrade) gridValores.push(Math.round(v * 100) / 100);

  const gridLinhas = gridValores.map(v => `
    <line x1="${padL}" y1="${yPix(v).toFixed(1)}" x2="${W - padR}" y2="${yPix(v).toFixed(1)}" stroke="#E7DCF5" stroke-width="1"/>
    <text x="${padL - 8}" y="${(yPix(v) + 3.5).toFixed(1)}" font-size="10.5" fill="var(--cor-texto, #8A7FA8)" text-anchor="end">${v}</text>
  `).join("");

  const xRotulos = bimestres.map((b, bi) => `
    <text x="${xPix(bi).toFixed(1)}" y="${H - padB + 22}" font-size="11" fill="#6B5E85" text-anchor="middle" font-weight="700">${esc(b.nome) || "Bimestre"}</text>
  `).join("");

  const linhasEPontos = series.map(s => {
    // quebra em segmentos contínuos, sem desenhar uma linha "fantasma" atravessando bimestres sem nota
    const segmentos = [];
    let atual = [];
    let ultimoX = null;
    s.pontos.forEach(p => {
      if (ultimoX !== null && p.x !== ultimoX + 1) { segmentos.push(atual); atual = []; }
      atual.push(p);
      ultimoX = p.x;
    });
    if (atual.length) segmentos.push(atual);

    const paths = segmentos.map(seg => {
      const d = seg.map((p, i) => `${i === 0 ? "M" : "L"} ${xPix(p.x).toFixed(1)} ${yPix(p.y).toFixed(1)}`).join(" ");
      return `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    }).join("");

    const circulos = s.pontos.map(p => `
      <circle cx="${xPix(p.x).toFixed(1)}" cy="${yPix(p.y).toFixed(1)}" r="4.5" fill="${s.cor}" stroke="#fff" stroke-width="1.5">
        <title>${esc(s.aluno.nome) || "(sem nome)"} — ${esc(bimestres[p.x].nome)}: ${p.y.toFixed(1)}</title>
      </circle>`).join("");

    return paths + circulos;
  }).join("");

  const svg = `
    <svg viewBox="0 0 ${W} ${H}" class="grafico-svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${t("grafico_aria_label")}">
      ${gridLinhas}
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#D9CCEF" stroke-width="1.5"/>
      <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#D9CCEF" stroke-width="1.5"/>
      ${xRotulos}
      ${linhasEPontos}
    </svg>`;

  const legenda = series.map(s => {
    const primeira = s.pontos[0].y;
    const ultima = s.pontos[s.pontos.length - 1].y;
    const delta = ultima - primeira;
    let indicador, cor;
    if (s.pontos.length < 2) { indicador = t("grafico_so_um_bimestre"); cor = "var(--cor-texto, #8A7FA8)"; }
    else if (delta > 0.05) { indicador = `<span class="seta-cima"></span> ${t("grafico_melhorou")} ${delta.toFixed(1)} ${delta >= 1.95 ? t("grafico_ponto_pl") : t("grafico_ponto_sg")}`; cor = "#7C9A72"; }
    else if (delta < -0.05) { indicador = `<span class="seta-baixo"></span> ${t("grafico_piorou")} ${Math.abs(delta).toFixed(1)} ${Math.abs(delta) >= 1.95 ? t("grafico_ponto_pl") : t("grafico_ponto_sg")}`; cor = "#B5765C"; }
    else { indicador = t("grafico_manteve"); cor = "var(--cor-texto, #8A7FA8)"; }
    return `
      <div class="grafico-legenda-item">
        <span class="grafico-legenda-cor" style="background:${s.cor}"></span>
        <span class="grafico-legenda-nome">${nomeOuPlaceholder(s.aluno.nome)}</span>
        <span class="grafico-legenda-trend" style="color:${cor}">${indicador}</span>
      </div>`;
  }).join("");

  return `
    <div class="grafico-section">
      <div class="resumo-title">${t("grafico_titulo")}</div>
      <div class="resumo-sub">${t("grafico_desempenho_sub")} ${series.length < alunos.length && !filtroValido ? t("grafico_sem_nota_aviso") : t("grafico_um_ponto_aviso")}</div>
      ${seletorAluno}
      <div class="grafico-wrap">${svg}</div>
      <div class="grafico-legenda">${legenda}</div>
    </div>`;
}

function renderModal() {
  const root = document.getElementById("modalRoot");
  if (syncModalOpen) { root.innerHTML = syncModalHtml(); return; }
  if (configModalOpen) { root.innerHTML = configModalHtml(); return; }
  if (colarListaModalOpen) { root.innerHTML = colarListaModalHtml(); return; }
  if (jaInstaladoModalOpen) { root.innerHTML = jaInstaladoModalHtml(); return; }
  if (instalarModalOpen) { root.innerHTML = instalarModalHtml(); return; }
  if (desinstalarModalOpen) { root.innerHTML = desinstalarModalHtml(); return; }
  if (!confirmDelete) { root.innerHTML = ""; return; }
  let texto;
  if (confirmDelete.type === "turma") {
    const nomeExibicao = confirmDelete.nome && confirmDelete.nome !== "esta turma" ? `<strong>${esc(confirmDelete.nome)}</strong>` : t("esta_sala");
    texto = t("confirmar_apagar_sala_texto").replace("{nome}", nomeExibicao);
  }
  else if (confirmDelete.type === "aluno") texto = t("confirmar_apagar_aluno_texto").replace("{nome}", `<strong>${esc(confirmDelete.nome) || t("sem_nome")}</strong>`);
  else if (confirmDelete.type === "bimestre") texto = t("confirmar_apagar_bimestre_texto").replace("{nome}", `<strong>${esc(confirmDelete.nome) || t("sem_nome")}</strong>`);
  else if (confirmDelete.type === "domiciliar") texto = t("confirmar_domiciliar_texto").replace("{nome}", `<strong>${esc(confirmDelete.nome) || t("sem_nome")}</strong>`);
  else texto = t("confirmar_apagar_dia_texto").replace("{nome}", `<strong>${esc(confirmDelete.nome)}</strong>`);
  root.innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-text">⚠️ ${texto}</div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="cancelarDelete()">${t("cancelar")}</button>
          <button class="btn-confirm-delete" onclick="confirmarDelete()">${confirmDelete.type === "domiciliar" ? t("confirmar_domiciliar_botao") : t("botao_apagar")}</button>
        </div>
      </div>
    </div>`;
}

// ---------- Renderização: imediata para cliques/toggles, adiada (debounce) para digitação contínua ----------
// Evita redesenhar a tela inteira a cada tecla digitada num campo de texto — o valor
// salvo já fica correto na hora (salvar() roda sempre), só o redesenho visual das
// OUTRAS partes da tela (tabelas de resumo, gráfico, etc.) é que espera uma pequena
// pausa na digitação antes de acontecer.
let renderDebounceTimer = null;
let renderIdleHandle = null;
let commitDebounceTimer = null;
// quando um redesenho fica pendente enquanto a pessoa ainda está com um campo de
// texto focado, ele é adiado até o campo perder o foco — ver renderOuAdiarPeloFoco()
let renderPendenteAoDesfocar = false;
// só adia quando o campo em foco é de fato um dos que o usuário digita em texto
// livre (teclado na tela) — pills, checkboxes e botões não têm esse problema
function campoDeTextoEstaFocado() {
  const ativo = document.activeElement;
  return !!(ativo && ativo.dataset && ativo.dataset.field && (ativo.tagName === "INPUT" || ativo.tagName === "TEXTAREA") && ativo.type !== "checkbox" && ativo.type !== "radio");
}
function renderOuAdiarPeloFoco() {
  if (campoDeTextoEstaFocado()) { renderPendenteAoDesfocar = true; return; }
  render();
}
document.addEventListener("focusout", (e) => {
  if (renderPendenteAoDesfocar && e.target && e.target.dataset && e.target.dataset.field) {
    renderPendenteAoDesfocar = false;
    // setTimeout 0 em vez de chamar render() na hora: se o foco saiu do campo
    // porque a pessoa clicou em outro elemento (ex.: uma pill), esse clique ainda
    // está em andamento (focusout dispara antes do click) — redesenhar agora destruiria
    // o elemento clicado antes do evento de click chegar nele, perdendo o clique
    setTimeout(render, 0);
  }
}, true);
function renderDebounced() {
  clearTimeout(renderDebounceTimer);
  if (renderIdleHandle && window.cancelIdleCallback) cancelIdleCallback(renderIdleHandle);
  renderDebounceTimer = setTimeout(() => {
    renderDebounceTimer = null;
    // agenda pra um momento ocioso do navegador quando possível, em vez de travar
    // na hora — assim uma tecla que a pessoa ainda esteja digitando (em celulares
    // mais lentos) tem prioridade sobre o redesenho da tela.
    // OBS: aqui NÃO adia pelo foco (diferente do commitDebounced) — hoje o único uso
    // é a busca de alunos, que precisa atualizar a lista filtrada em tempo real
    // enquanto a pessoa ainda está digitando, então adiar quebraria a própria função dela
    if (window.requestIdleCallback) {
      renderIdleHandle = requestIdleCallback(() => { renderIdleHandle = null; render(); }, { timeout: 300 });
    } else {
      render();
    }
  }, 380);
}
// como renderDebounced(), mas também adia o salvar() (que serializa e grava todos
// os dados no localStorage) — em turmas com muito histórico, fazer isso a cada
// tecla digitada é o que mais pesa em celulares mais lentos. O valor já fica
// correto na memória na hora (quem chama já atualizou o objeto antes de chamar
// isso); só a GRAVAÇÃO em disco e o redesenho da tela é que esperam a pausa.
function commitDebounced() {
  clearTimeout(commitDebounceTimer);
  clearTimeout(renderDebounceTimer);
  if (renderIdleHandle && window.cancelIdleCallback) { cancelIdleCallback(renderIdleHandle); renderIdleHandle = null; }
  commitDebounceTimer = setTimeout(() => {
    commitDebounceTimer = null;
    salvar();
    if (window.requestIdleCallback) {
      renderIdleHandle = requestIdleCallback(() => { renderIdleHandle = null; renderOuAdiarPeloFoco(); }, { timeout: 300 });
    } else {
      renderOuAdiarPeloFoco();
    }
  }, 380);
}

function render() {
  clearTimeout(renderDebounceTimer); // uma renderização imediata cancela qualquer redesenho adiado pendente
  renderDebounceTimer = null;
  clearTimeout(commitDebounceTimer);
  commitDebounceTimer = null;
  if (renderIdleHandle && window.cancelIdleCallback) { cancelIdleCallback(renderIdleHandle); renderIdleHandle = null; }
  // guarda o campo focado (e a posição do cursor) antes de redesenhar,
  // pra não perder o foco a cada tecla digitada
  const ativo = document.activeElement;
  let restaurar = null;
  if (ativo && ativo.dataset && ativo.dataset.field) {
    let inicio = null, fim = null;
    try { inicio = ativo.selectionStart; fim = ativo.selectionEnd; } catch (e) { /* tipos como date/number não suportam seleção */ }
    restaurar = { campo: ativo.dataset.field, inicio: typeof inicio === "number" ? inicio : null, fim };
  }

  renderTabs();
  renderMain();
  renderModal();

  if (restaurar) {
    const el = document.querySelector(`[data-field="${cssEsc(restaurar.campo)}"]`);
    if (el) {
      el.focus();
      if (restaurar.inicio !== null && el.setSelectionRange) {
        try { el.setSelectionRange(restaurar.inicio, restaurar.fim); } catch (e) { /* alguns tipos de input (date) não suportam */ }
      }
    }
  }
  // a barra de dias é reconstruída do zero a cada render (innerHTML), então
  // perde a posição de rolagem sozinha — sem isso, toda vez que um dia novo
  // é criado (ou qualquer outra coisa dispara um render), a barra volta pro
  // início mostrando as primeiras aulas, mesmo com o dia certo já selecionado
  const diasBar = document.getElementById("diasBar");
  if (diasBar) {
    const chipAtivo = diasBar.querySelector(".dia-chip.active");
    if (chipAtivo) {
      const rectBarra = diasBar.getBoundingClientRect();
      const rectChip = chipAtivo.getBoundingClientRect();
      // posição do chip dentro do conteúdo rolável da barra (não da tela) —
      // soma a rolagem atual pra "desfazer" o efeito dela na leitura da posição
      const chipRelativo = (rectChip.left - rectBarra.left) + diasBar.scrollLeft;
      const alvo = chipRelativo - (diasBar.clientWidth - rectChip.width) / 2;
      diasBar.scrollLeft = Math.max(0, alvo);
    }
  }
}
function cssEsc(s) { return s.replace(/["\\]/g, "\\$&"); }

document.getElementById("btnAddTurmaSide").addEventListener("click", addTurma);

/* ---------- Arrastar com o mouse na barra de dias e nas tabelas de resumo (desktop) ---------- */
let dragState = null;
let suprimirProximoClick = false; // evita selecionar/apagar o chip que ficou embaixo do mouse ao SOLTAR depois de arrastar
const mainEl = document.getElementById("main");
mainEl.addEventListener("mousedown", (e) => {
  const bar = e.target.closest(".dias-bar, .bimestres-bar, .resumo-scroll");
  if (!bar) return;
  dragState = { bar, startX: e.pageX, scrollLeft: bar.scrollLeft, moveu: false };
  bar.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (!dragState) return;
  const dx = e.pageX - dragState.startX;
  if (Math.abs(dx) > 4) dragState.moveu = true;
  dragState.bar.scrollLeft = dragState.scrollLeft - dx;
});
window.addEventListener("mouseup", () => {
  if (dragState) {
    dragState.bar.classList.remove("dragging");
    if (dragState.moveu) suprimirProximoClick = true;
  }
  dragState = null;
});
// fase de captura: intercepta o clique ANTES que o onclick do chip (dia/bimestre) rode
mainEl.addEventListener("click", (e) => {
  if (suprimirProximoClick) {
    suprimirProximoClick = false;
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

/* ---------- Deslizar com o dedo para trocar de dia (mobile) ---------- */
let touchStartX = null;
let touchStartY = null;
mainEl.addEventListener("touchstart", (e) => {
  if (e.target.closest(".dias-bar, .bimestres-bar, .resumo-scroll, input, textarea")) { touchStartX = null; touchStartY = null; return; }
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
});
mainEl.addEventListener("touchend", (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  touchStartX = null;
  touchStartY = null;
  // uma rolagem vertical normal (pra ver a lista de alunos, por exemplo) sempre
  // tem algum desvio lateral natural do dedo — só conta como "arrastou pra
  // trocar de dia" quando o movimento for claramente mais horizontal do que
  // vertical, senão qualquer rolagem na tela ficava trocando o dia sozinha
  if (Math.abs(dx) < 70) return;
  if (Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const turma = turmas.find(t => t.id === turmaAtivaId);
  if (!turma) return;
  const bimestre = turma.bimestres.find(b => b.id === turma.bimestreAtivoId);
  if (bimestre) irParaDiaAdjacente(turma.id, bimestre.id, dx < 0 ? 1 : -1); // arrastou p/ esquerda = próximo dia
});

// qualquer clique ou digitação em algum lugar da tela conta como "o usuário já
// começou a mexer no app" — invalida a carga inicial da planilha se ela ainda
// não tiver chegado, pra ela não sobrescrever o que a pessoa acabou de fazer
document.body.addEventListener("click", () => { cargaInicialSyncPendente = false; }, { capture: true });
document.body.addEventListener("input", () => { cargaInicialSyncPendente = false; }, { capture: true });

carregarTema();
carregar();

/* ---------- PWA: instalação e funcionamento offline ----------
   Só funciona quando o app está hospedado em http(s) ou localhost — navegadores
   bloqueiam Service Worker e o prompt de instalação em arquivos abertos direto
   do computador (file://). Nesses casos o código abaixo simplesmente não faz nada. */
if ("serviceWorker" in navigator && window.isSecureContext) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
  // assim que uma versão nova do service worker assume o controle da página
  // (por causa do skipWaiting/clients.claim já configurados nele), recarrega
  // sozinho pra essa versão nova realmente aparecer na tela
  let jaRecarregouPorAtualizacao = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (jaRecarregouPorAtualizacao) return;
    jaRecarregouPorAtualizacao = true;
    location.reload();
  });
}
// botão "Verificar atualização": força o navegador a checar agora mesmo se
// existe uma versão mais nova publicada, em vez de esperar a próxima vez que
// o app for aberto sozinho. Se achar uma versão nova, a página recarrega
// automaticamente pelo listener de controllerchange acima.
async function verificarAtualizacaoApp() {
  if (!("serviceWorker" in navigator) || !window.isSecureContext) {
    alert(t("alerta_atualizacao_nao_suportada"));
    return;
  }
  definirStatusIndicador("status_verificando_atualizacao");
  try {
    const registration = await navigator.serviceWorker.getRegistration();
    if (!registration) { definirStatusIndicador("status_salvo_local"); return; }
    await registration.update();
    // dá um tempinho pro navegador instalar e ativar uma versão nova, se houver
    // (o listener de controllerchange recarrega sozinho assim que isso acontecer)
    setTimeout(() => {
      if (!registration.waiting && !registration.installing) {
        definirStatusIndicador("status_ja_atualizado");
      }
    }, 2000);
  } catch (e) {
    definirStatusIndicador("status_sem_conexao");
  }
}

let eventoInstalacao = null;
// mostra, sem a pessoa precisar clicar em nada, se o botão vai instalar
// direto com 1 clique ou se vai mostrar o passo a passo — assim não tem
// susto: dá pra saber antes de clicar o que vai acontecer
function atualizarStatusInstalacao() {
  const el = document.getElementById("instalarAppStatus");
  if (!el) return;
  if (appJaInstalado()) { el.textContent = ""; return; }
  if (eventoInstalacao) { el.textContent = t("instalar_status_pronto"); return; }
  if (detectarPlataformaInstalacao() === "ios") { el.textContent = t("instalar_status_ios"); return; }
  el.textContent = t("instalar_status_aguardando");
}
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); // segura o prompt automático do navegador pra mostrar nosso próprio botão
  eventoInstalacao = e;
  // como o botão agora mora dentro do painel de ferramentas (escondido até
  // clicar no ícone), marca o ícone com uma bolinha pra avisar que tem algo novo
  // ali, e abre o painel sozinho uma vez pra garantir que a pessoa realmente veja
  const iconeRail = document.getElementById("btnToggleFerramentas");
  if (iconeRail) iconeRail.classList.add("tem-novidade");
  if (!ferramentasAbertas) { ferramentasAbertas = true; aplicarEstadoFerramentas(); }
  atualizarStatusInstalacao();
});
// true quando o navegador já está rodando o app instalado (modo standalone) —
// alguns navegadores/SOs conseguem detectar isso, outros não; quando não dá
// pra saber ao certo, tratamos como "ainda não instalado" (mais seguro)
function appJaInstalado() {
  return window.matchMedia && window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true; // Safari/iOS usa essa propriedade própria
}
function detectarPlataformaInstalacao() {
  const ua = navigator.userAgent || "";
  if (/iPad|iPhone|iPod/.test(ua) || (ua.includes("Macintosh") && navigator.maxTouchPoints > 1)) return "ios";
  if (/Android/.test(ua)) return "android";
  return "desktop";
}
function instalarApp() {
  if (appJaInstalado()) { jaInstaladoModalOpen = true; render(); return; }
  if (eventoInstalacao) {
    try {
      eventoInstalacao.prompt();
      eventoInstalacao.userChoice.finally(() => { eventoInstalacao = null; });
      return;
    } catch (erro) {
      // o evento pode ter "vencido" (só serve uma vez) ou o navegador pode ter
      // mudado de ideia sobre oferecer o prompt — em vez de falhar calado, cai
      // no guia manual abaixo, que sempre funciona
      eventoInstalacao = null;
      atualizarStatusInstalacao();
    }
  }
  // navegador não ofereceu o prompt automático (é sempre assim no iPhone/iPad,
  // e pode acontecer em outros navegadores também) — mostra o passo a passo manual
  instalarModalPlataforma = detectarPlataformaInstalacao();
  instalarModalOpen = true;
  render();
}
document.getElementById("btnInstalarApp").addEventListener("click", instalarApp);
window.addEventListener("appinstalled", () => { eventoInstalacao = null; atualizarStatusInstalacao(); });
atualizarStatusInstalacao(); // define o texto certo assim que a página carrega, sem esperar clique
</script>
